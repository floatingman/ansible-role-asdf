---
- name: "get users HOME"
  getent:
    database: passwd
    key: "{{ asdf_user }}"
    split: ":"
  when: asdf_dir is undefined

- name: "set asdf_config_file based on home directory"
  set_fact:
    asdf_config_file: "{{ ansible_facts.getent_passwd[asdf_user][4] }}/.asdfrc"
  when: asdf_dir is undefined and asdf_config_file is undefined

- name: "set asdf_default_tool_versions_file based on home directory"
  set_fact:
    asdf_default_tool_versions_file: "{{ ansible_facts.getent_passwd[asdf_user][4] }}/.tool-versions"
  when: asdf_dir is undefined and asdf_default_tool_versions_file is undefined

- name: "set asdf_dir variable based on home directory"
  set_fact:
    asdf_dir: "{{ ansible_facts.getent_passwd[asdf_user][4] }}/.asdf"
  when: asdf_dir is undefined

- name: "set asdf_config_file variable based on asdf_dir"
  set_fact:
    asdf_config_file: "{{ asdf_dir }}/asdfrc"
  when: asdf_config_file is undefined

- name: "set asdf_default_tool_versions_file variable based on asdf_dir"
  set_fact:
    asdf_default_tool_versions_file: "{{ asdf_dir }}/tool-versions"
  when: asdf_default_tool_versions_file is undefined

- name: "install asdf global dependencies with apt"
  apt:
    name: "{{ asdf_apt_global_dependencies }}"
    install_recommends: no
    cache_valid_time: "{{ apt_cache_valid_time }}"
  become: True
  retries: "{{ remote_package_retries }}"
  register: apt_deps_result
  until: apt_deps_result is succeeded
  when: ansible_facts['os_family'] == "Debian"

- name: "install asdf global dependencies with yum"
  yum:
    name: "{{ asdf_yum_global_dependencies }}"
  become: True
  retries: "{{ remote_package_retries }}"
  register: yum_deps_result
  until: yum_deps_result is succeeded
  when: ansible_facts['os_family'] == "RedHat"

- name: "install asdf global dependencies with pacman"
  pacman:
    name: "{{ asdf_pacman_global_dependencies }}"
    state: present
  become: True
  retries: "{{ remote_package_retries }}"
  register: pacman_deps_result
  until: pacman_deps_result is succeeded
  when: ansible_facts['os_family'] == "Archlinux"

- name: "ensure asdf_dir presence and ownership"
  file:
    path: "{{ asdf_dir }}"
    owner: "{{ asdf_user }}"
    group: "{{ asdf_group }}"
    state: directory
  become: True

- name: "clone asdf repository"
  git:
    repo: "https://github.com/asdf-vm/asdf.git"
    dest: "{{ asdf_dir }}"
    version: "{{ asdf_version }}"
    depth: 1
    # force: yes so the role re-applies cleanly on later runs. The bin/asdf ->
    # Go symlink task below modifies a tracked file; without force the git module
    # would error "Local modifications exist" on the next run. Untracked runtime
    # data (installs/, plugins/, shims/) is preserved.
    force: yes
  become: True
  become_user: "{{ asdf_user }}"

# asdf v0.16+ (the Go rewrite) publishes prebuilt release binaries. Building
# from source needs a Go toolchain new enough for the go.mod `go` directive —
# apt's golang-go on Debian 11/Ubuntu 22.04 is Go 1.18, which cannot even
# parse the three-part directive ("invalid go version '1.23.4': must match
# format 1.23"), so `make build` failed there. Installing the release binary
# needs no compiler, and copy's checksum comparison replaces the binary on
# version bumps (the old `make build` + `creates:` guard kept a stale binary
# after a bump anyway).
- name: "map platform to asdf release asset"
  set_fact:
    asdf_release: >-
      asdf-{{ asdf_version }}-{{ {'Darwin': 'darwin', 'Linux': 'linux'}[ansible_facts['system']] }}-{{ {'x86_64': 'amd64', 'i386': '386', 'i686': '386', 'aarch64': 'arm64', 'arm64': 'arm64'}[ansible_facts['architecture']] }}

- name: "download asdf release archive"
  get_url:
    url: "https://github.com/asdf-vm/asdf/releases/download/{{ asdf_version }}/{{ asdf_release }}.tar.gz"
    dest: "/tmp/{{ asdf_release }}.tar.gz"
    mode: "0644"
  become: True
  become_user: "{{ asdf_user }}"

- name: "create asdf release extract directory"
  file:
    path: "/tmp/{{ asdf_release }}"
    state: directory
    mode: "0700"
  become: True
  become_user: "{{ asdf_user }}"

- name: "extract asdf release archive"
  unarchive:
    src: "/tmp/{{ asdf_release }}.tar.gz"
    dest: "/tmp/{{ asdf_release }}"
    remote_src: true
    creates: "/tmp/{{ asdf_release }}/asdf"
  become: True
  become_user: "{{ asdf_user }}"

- name: "install asdf binary"
  copy:
    src: "/tmp/{{ asdf_release }}/asdf"
    dest: "{{ asdf_dir }}/asdf"
    mode: "0755"
    remote_src: true
  become: True
  become_user: "{{ asdf_user }}"

# asdf 0.16+ (the Go rewrite) ships BOTH the Go binary ({{ asdf_dir }}/asdf) and
# a legacy bash wrapper ({{ asdf_dir }}/bin/asdf) that prints the "upgrade to
# 0.16" migration notice on every invocation. Shims generated by older asdf
# exec bin/asdf, so without this every node/npm/... call prints the notice and
# runs through the legacy bash path. Point bin/asdf at the Go binary so those
# shims route through Go: no notice, and the (working) Go exec path. asdf 0.18
# writes fresh shims as `exec asdf exec ...` (bare asdf -> /usr/local/bin/asdf
# -> Go), which is also correct. The git clone restores the legacy bin/asdf on
# version bumps, so this runs after clone/install each run (idempotent, force:yes).
- name: "point legacy bin/asdf at the Go binary (silence migration notice)"
  file:
    src: "{{ asdf_dir }}/asdf"
    dest: "{{ asdf_dir }}/bin/asdf"
    state: link
    force: yes
  become: True

- name: "create asdf bin symlink directory"
  file:
    path: "/usr/local/bin"
    state: directory
    mode: 0755
  become: True

- name: "symlink asdf binary to /usr/local/bin"
  file:
    src: "{{ asdf_dir }}/asdf"
    dest: "/usr/local/bin/asdf"
    state: link
    force: yes
  become: True

- name: "source asdf script"
  template:
    src: "asdf.sh.j2"
    dest: "/etc/profile.d/asdf.sh"
    owner: "root"
    group: "root"
    mode: 0755
  become: True
